<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Fondo circular verde -->
  <circle cx="60" cy="60" r="58" fill="#0D7A40"/>
  <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Figura humana en movimiento (corriendo/saltando) -->
  <!-- Cabeza -->
  <circle cx="75" cy="30" r="8" fill="#FFFFFF"/>
  <!-- Cuerpo -->
  <line x1="75" y1="38" x2="72" y2="58" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <!-- Brazo izquierdo -->
  <line x1="74" y1="44" x2="58" y2="38" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Brazo derecho -->
  <line x1="73" y1="46" x2="84" y2="55" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Pierna izquierda -->
  <line x1="72" y1="58" x2="58" y2="72" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Pierna derecha -->
  <line x1="72" y1="58" x2="82" y2="73" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Hoja / planta estilizada (símbolo Andalucía / naturaleza) -->
  <path d="M30 80 Q20 58 38 48 Q32 65 50 68 Q38 72 30 80Z" fill="rgba(255,255,255,0.25)"/>
  <path d="M30 80 Q42 70 48 52 Q38 65 50 68 Q38 72 30 80Z" fill="rgba(255,255,255,0.40)"/>
  <line x1="30" y1="80" x2="46" y2="60" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Texto "NIA" -->
  <text x="60" y="102" font-family="Georgia, serif" font-size="13" font-weight="700" fill="rgba(255,255,255,0.9)" text-anchor="middle" letter-spacing="3">NIA</text>
</svg>
